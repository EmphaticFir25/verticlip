services:
  verticlip:
    build: https://github.com/EmphaticFir25/verticlip.git
    image: verticlip:latest
    restart: unless-stopped
    ports:
      - "33214:33214"
    env_file:
      - path: .env
        required: false
    environment:
      FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      GOOGLE_CLIENT_SECRETS: /app/data/client_secret.json
    volumes:
      - ./data:/app/data
      - ./data/hf-cache:/root/.cache/huggingface
